# code-diff — feature folders. A feature owns its types, its dumb components and
# its hooks (in hooks/); nothing else lives here. The invariants below are the
# base floor every repository shares.

nodes:
  - slug: root
    name: .
    children: [board, columns, rows, ribbon, surface, styles, components, demo, tests, reports, index.ts, { name: view.tsx, role: barrel }, config.ts, package.json, pnpm-lock.yaml, tsconfig.json, vitest.config.ts, eslint.config.mjs, architecture.yaml, README.md, ARCHITECTURE.md, LICENSE, .gitignore]

  - slug: board
    name: board
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: columns
    name: columns
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: rows
    name: rows
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: ribbon
    name: ribbon
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: surface
    name: surface
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: styles
    name: styles
    parent: root
    children: ["*.ts", "*.tsx"]

  - slug: components
    name: components
    parent: root
    children: ["*.ts", "*.tsx", "hooks"]

  - slug: demo
    name: demo
    parent: root
    children: ["*.ts", "*.tsx", "fixtures"]

  - slug: demo-fixtures
    name: fixtures
    parent: demo
    children: ["*.ts", "*.tsx"]

  - slug: tests
    name: tests
    parent: root
    children: ["*.ts", "*.tsx", "model", "view"]

  - slug: tests-model
    name: model
    parent: tests
    children: ["*.ts", "*.tsx"]

  - slug: tests-view
    name: view
    parent: tests
    children: ["*.ts", "*.tsx"]

  - slug: board-hooks
    name: hooks
    parent: board
    children: ["*.ts", "*.tsx"]

  - slug: columns-hooks
    name: hooks
    parent: columns
    children: ["*.ts", "*.tsx"]

  - slug: rows-hooks
    name: hooks
    parent: rows
    children: ["*.ts", "*.tsx"]

  - slug: ribbon-hooks
    name: hooks
    parent: ribbon
    children: ["*.ts", "*.tsx"]

  - slug: surface-hooks
    name: hooks
    parent: surface
    children: ["*.ts", "*.tsx"]

  - slug: components-hooks
    name: hooks
    parent: components
    children: ["*.ts", "*.tsx"]

# ── codeRoles ────────────────────────────────────────────────────────────────
# What the code IS. First matching infer wins; a role with no home may live
# anywhere in the tree, and every role may use every other — this package is one
# layer of generic view code, so the permissions are open by design.

codeRoles:
  - slug: sharedTypes
    name: shared type
    infer:
      - kind: { own: { is: { in: [InterfaceDeclaration, TypeAliasDeclaration] } } }
    actions:
      declare: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      export: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }

  - slug: hook
    name: react hook
    infer:
      - kind: { own: { is: { in: [FunctionDeclaration, ArrowFunction, VariableDeclaration] } } }
      - name: { matches: "use[A-Z]*" }
    actions:
      declare: { where: [{ role: hook }, { role: viewComponent }, { role: logic }] }
      export: { where: [{ role: hook }, { role: viewComponent }, { role: logic }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }

  - slug: styledBlock
    name: styled block
    infer:
      - kind: { own: { is: { equals: VariableDeclaration } } }
      - calls: { any: { module: { equals: "styled-components" } } }
    actions:
      declare: { where: [{ role: styledBlock }, { role: viewComponent }] }
      export: { where: [{ role: styledBlock }, { role: viewComponent }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }

  - slug: viewComponent
    name: view component
    infer:
      - framework: { component: { equals: true } }
    actions:
      declare: { where: [{ role: viewComponent }, { role: hook }, { role: logic }] }
      export: { where: [{ role: viewComponent }, { role: hook }, { role: logic }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }

  - slug: testCode
    name: test
    infer:
      - location: { path: { matches: "**/tests/**" } }
    actions:
      declare: { where: [{ role: testCode }] }
      export: { where: [{ role: testCode }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }

  - slug: barrel
    name: public barrel
    infer:
      # A barrel is a file of re-exports: every export republishes another
      # module's binding (`from` set), and the file declares no code of its own
      # (no exported function/variable). index.ts is the model barrel; view.tsx
      # is the React entry barrel.
      - file:
          exports: { length: { gt: 0 }, every: { from: { isSet: true } } }
      - kind: { own: { is: { in: [JSDocComment, MultiLineCommentTrivia, SingleLineCommentTrivia] } } }
    actions:
      declare: { where: [{ role: barrel }] }
      export: { where: [{ role: barrel }, { role: logic }, { role: hook }, { role: viewComponent }, { role: sharedTypes }, { role: styledBlock }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: barrel }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: barrel }] }
      call: { where: [{ role: barrel }] }
      read: { where: [{ role: barrel }] }
      assign: { where: [{ role: barrel }] }
      mutate: { where: [{ role: barrel }] }

  - slug: objectMember
    name: object member
    infer:
      - kind:
          own: { is: { in: [FunctionDeclaration, ArrowFunction, FunctionExpression, MethodDeclaration] } }
          parent: { is: { in: [PropertyAssignment, ObjectLiteralExpression] } }
    actions:
      declare: { where: [{ role: objectMember }, { role: logic }, { role: hook }, { role: viewComponent }] }
      export: { where: [{ role: objectMember }, { role: logic }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }, { role: objectMember }] }

  - slug: logic
    name: logic
    infer:
      - kind: { own: { is: { in: [FunctionDeclaration, ArrowFunction, VariableDeclaration] } } }
    actions:
      declare: { where: [{ role: logic }, { role: hook }, { role: viewComponent }, { role: styledBlock }, { role: testCode }, { role: sharedTypes }] }
      export: { where: [{ role: logic }, { role: hook }, { role: viewComponent }, { role: styledBlock }, { role: testCode }, { role: sharedTypes }] }
      import: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      call: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      typeImport: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      read: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      assign: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }
      mutate: { where: [{ role: sharedTypes }, { role: hook }, { role: viewComponent }, { role: logic }, { role: styledBlock }, { role: testCode }] }


invariants:
  # ── THE BASE FLOOR (same rules as the other repositories) ─────────────────
  # Each infer entry is ONE filter over a candidate's facts: every key in the
  # entry must match. A type declaration is not a function, so the function
  # rules name the function kinds AND require a name — interfaces and consts
  # are not their subject.

  - id: no-require
    infer:
      - imports: { any: { form: { is: "require" } } }
        report:
          code: rewrite
          description: "`{what}` reaches a module through `require`."
          fix:
            message: "Use an `import` — the package is ESM."

  - id: no-classes
    infer:
      - kind: { own: { is: { equals: ClassDeclaration } } }
        report:
          code: rewrite
          description: "`{what}` is a class."
          fix:
            message: "Write it as functions and plain data."

  - id: no-empty-functions
    infer:
      - calls: { length: { equals: 0 } }
        assignments: { length: { equals: 0 } }
        returns: { length: { equals: 0 } }
        kind:
          own: { is: { in: [FunctionDeclaration, FunctionExpression, ArrowFunction, MethodDeclaration, GetAccessor, SetAccessor] } }
          descendants: { any: { is: { equals: Block } } }
        name: { isSet: true }
        report:
          code: remove
          description: "`{what}` has an empty body. It either must do something or not exist."
          fix:
            message: "Implement it, or delete it and its call sites."

  - id: no-useless-functions
    infer:
      # ONE return, no branches, no locals — a name given to a single expression.
      - kind:
          own: { is: { in: [FunctionDeclaration, ArrowFunction, FunctionExpression, MethodDeclaration] } }
          parent: { is: { notIn: [PropertyAssignment] } }
          descendants: { any: { is: { equals: Block } } }
        name: { isSet: true }
        assignments: { length: { equals: 0 } }
        branches: { length: { equals: 0 } }
        returns:
          length: { equals: 1 }
          any:
            kind: { equals: ReturnStatement }
            exprKind: { equals: Identifier }
        report:
          code: remove
          description: "`{what}` is one expression given a name: its whole body is a single `return`, with no branch and no local."
          fix:
            message: "Inline it at the call sites, or make it carry a rule the caller must not restate."

  - id: no-oversized-files
    infer:
      - lines: { length: { gt: 200 } }
        report:
          code: split
          description: "`{what}` is over 200 lines."
          fix:
            message: "Split it by feature: types, logic and view in their own files."

  - id: no-large-folders
    infer:
      - files: { length: { gt: 5 } }
        report:
          code: split
          description: "`{what}` holds more than 5 files."
          fix:
            message: "Group the files into sub-features (hooks/ already is one)."
